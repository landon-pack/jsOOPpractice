<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>

    <style>
        /* Make width and height calculations easier */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f3f6fa;
            color: #243447;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #174a7e;
        }

        .intro {
            color: #5c6b7a;
            margin-bottom: 20px;
        }

        /* Student grid */
        .student-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1.3fr 1fr .7fr;
            border: 1px solid #ccd6e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .grid-header {
            background-color: #174a7e;
            color: white;
            font-weight: bold;
            padding: 12px;
        }

        .grid-cell {
            padding: 12px;
            border-bottom: 1px solid #dce3ea;
            cursor: pointer;
        }

        #studentTable tr.selected {
    background-color: #d9ecff;
}

        /* Buttons */
        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            margin-right: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-button {
            background-color: #174a7e;
            color: white;
        }

        .edit-button {
            background-color: #e0a800;
            color: white;
        }

        .delete-button {
            background-color: #c0392b;
            color: white;
        }

        .cancel-button {
            background-color: #6c757d;
            color: white;
        }

        /* Student form */
        #studentForm {
            display: none;
            margin-top: 30px;
        }

        fieldset {
            border: 1px solid #ccd6e0;
            border-radius: 8px;
            padding: 20px;
        }

        legend {
            font-size: 20px;
            font-weight: bold;
            color: #174a7e;
            padding: 0 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            padding: 9px;
            border: 1px solid #b8c4cf;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .choice-group {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .choice-group label {
            font-weight: normal;
            margin-bottom: 0;
        }

        .form-buttons {
            margin-top: 20px;
        }

        /* Delete confirmation window */
        .modal-background {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
        }

        .modal {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
        }

        .modal h2 {
            margin-top: 0;
            color: #c0392b;
        }
    </style>
</head>


<!--
    When the page finishes loading, call loadStudents().
    This creates the three starting students.
-->
<body onload="loadStudents()">

    <div class="container">

        <h1>Student Management System</h1>

        <p class="intro">
            Select a student from the grid to edit or delete the student.
            Click Add Student to create a new student.
        </p>

        <!-- student table -->
        <table id="studentTable">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Major</th>
                    <th>Year</th>
                    <th>GPA</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>


        <!-- MAIN BUTTONS -->
        <div>
            <button type="button"
                    class="primary-button"
                    onclick="openAddForm()">
                Add Student
            </button>

            <button type="button"
                    class="edit-button"
                    onclick="openEditForm()">
                Edit Student
            </button>

            <button type="button"
                    class="delete-button"
                    onclick="requestDelete()">
                Delete Student
            </button>
        </div>


        <!-- ADD / EDIT STUDENT FORM -->
        <form id="studentForm">

            <fieldset>

                <legend id="formLegend">Add Student</legend>

                <div class="form-grid">

                    <!-- Text input -->
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text"
                               id="firstName"
                               required>
                    </div>


                    <!-- Text input -->
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text"
                               id="lastName"
                               required>
                    </div>


                    <!-- Password input -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password"
                               id="password">
                    </div>


                    <!-- Number input -->
                    <div class="form-group">
                        <label for="gpa">GPA:</label>
                        <input type="number"
                               id="gpa"
                               min="0"
                               max="4"
                               step="0.01">
                    </div>


                    <!-- Datalist -->
                    <div class="form-group">

                        <label for="major">Major:</label>

                        <input type="text"
                               id="major"
                               list="majorList">

                        <datalist id="majorList">
                            <option value="Information Systems">
                            <option value="Accounting">
                            <option value="Finance">
                            <option value="Marketing">
                            <option value="Management">
                        </datalist>

                    </div>


                    <!-- Combobox / select -->
                    <div class="form-group">

                        <label for="year">Year in School:</label>

                        <select id="year">
                            <option value="Freshman">Freshman</option>
                            <option value="Sophomore">Sophomore</option>
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>

                    </div>


                    <!-- Date input -->
                    <div class="form-group">

                        <label for="birthDate">Birth Date:</label>

                        <input type="date"
                               id="birthDate">

                    </div>


                    <!-- Date and time input -->
                    <div class="form-group">

                        <label for="appointment">
                            Advising Appointment:
                        </label>

                        <input type="datetime-local"
                               id="appointment">

                    </div>


                    <!-- Radio buttons -->
                    <div class="form-group full-width">

                        <label>Enrollment Status:</label>

                        <div class="choice-group">

                            <label>
                                <input type="radio"
                                       id="fullTime"
                                       name="status"
                                       value="Full-time"
                                       checked>
                                Full-time
                            </label>

                            <label>
                                <input type="radio"
                                       id="partTime"
                                       name="status"
                                       value="Part-time">
                                Part-time
                            </label>

                        </div>

                    </div>


                    <!-- Checkboxes -->
                    <div class="form-group full-width">

                        <label>Interests:</label>

                        <div class="choice-group">

                            <label>
                                <input type="checkbox"
                                       id="clubProgramming"
                                       value="Programming">
                                Programming
                            </label>

                            <label>
                                <input type="checkbox"
                                       id="clubAnalytics"
                                       value="Analytics">
                                Analytics
                            </label>

                            <label>
                                <input type="checkbox"
                                       id="clubBusiness"
                                       value="Business">
                                Business
                            </label>

                        </div>

                    </div>


                    <!-- Text area -->
                    <div class="form-group full-width">

                        <label for="comments">
                            Student Notes:
                        </label>

                        <textarea id="comments"></textarea>

                    </div>

                </div>


                <!-- SAVE / CANCEL -->
                <div class="form-buttons">

                    <button type="button"
                            class="primary-button"
                            onclick="saveStudent()">
                        Save Student
                    </button>

                    <button type="button"
                            class="cancel-button"
                            onclick="cancelAddEdit()">
                        Cancel
                    </button>

                </div>

            </fieldset>

        </form>

    </div>


    <!-- DELETE CONFIRMATION WINDOW -->
    <div class="modal-background"
         id="deleteModal">

        <div class="modal">

            <h2>Delete Student</h2>

            <p id="deleteMessage">
                Are you sure you want to delete this student?
            </p>

            <button type="button"
                    class="delete-button"
                    onclick="confirmDelete()">
                Delete
            </button>

            <button type="button"
                    class="cancel-button"
                    onclick="cancelDelete()">
                Cancel
            </button>

        </div>

    </div>

<script>

// create a global array called Students
let aStudents = [];


// create selectedindex and set it equal to -1
let iSelectedIndex = -1;

// create formMode and set the value to "add"
let sformMode = "add"

// set the next available id for when a new student is created
let iNextID = 1004;

// create person class
// create a constructor that recieves all parameters and loads attributes
// write a method called get_fullname() that returns the full name
   
class Person
{
    constructor(firstName, lastName, password, birthDate)
    {
        this.firstName = firstName;
        this.lastName = lastName;
        this.password = password;
        this.birthDate = birthDate
    }

        getFullName()
        {
            return this.firstName + ' ' + this.lastName;
        }
}



class Student extends Person
{
    constructor(firstName, lastName, password, birthDate, id, major, year,
                 gpa, appointment, status, interests, comments)
    {
        super(firstName, lastName, password, birthDate);
        this.id = id;
        this.major = major;
        this.year = year;
        this.gpa = gpa;
        this.appointment = appointment;
        this.status = status;
        this.interests = interests;
        this.comments = comments;


    }
    


}

// Load three starting students
// Create a function called loadStudents that creates 3 students using the student class and the new keyword
// Use the following starting information, and provide values for the remaining properties:
// ID	Name	Major	Year	GPA
// 1001	Susan Johnson	Information Systems	Junior	3.82
// 1002	Michael Chen	Finance	Senior	3.61
// 1003	Emma Garcia	Marketing	Sophomore	3.94

function loadStudents()
{
    let oStudent1 = new Student('Susan', 'Johnson', 'password', '2003-08-21', 1001, 
                                'Information Systems', 'Junior', 3.82, '2026-10-18T14:20', 'Full-time', 
                                ['Programming'], 'Very motivated student');
   

    let oStudent2 = new Student("Michael","Chen","sample456","2003-08-22",1002,"Finance","Senior",3.61,"2026-10-16T10:00","Full-time",
                                ["Business"],"Has 2 internship offers");

    let oStudent3 = new Student("Emma","Garcia","sample789","2005-02-10",1003,"Marketing","Sophomore", 3.94, "2026-10-17T13:00",
                                "Part-time",["Analytics", "Business"], "Loves to help others");

    aStudents.push(oStudent1);                           
    aStudents.push(oStudent2);
    aStudents.push(oStudent3);

    renderStudents()
    
}

// write the renderStudents function that will display the students in the html table
function renderStudents()
{

    document.getElementById("studentTableBody").innerHTML = "";

    // Use a for loop to iterate through each student and fill in the table
    for(let iCount = 0; iCount < aStudents.length; iCount++)
    {
     let oStudent = aStudents[iCount]
     
     let sRow = "";

    if (iCount === iSelectedIndex)
    {
    sRow = "<tr class='selected' onclick='selectStudent(" + iCount + ")'>";
    }
    else
    {
    sRow = "<tr onclick='selectStudent(" + iCount + ")'>";
    }
     sRow += "<td>" + oStudent.id + "</td>";
     sRow += "<td>" + oStudent.getFullName() + "</td>";
     sRow += "<td>" + oStudent.major + "</td>";
     sRow += "<td>" + oStudent.year + "</td>";
     sRow += "<td>" + oStudent.gpa + "</td>";
     sRow += "</tr>";
     document.getElementById("studentTableBody").innerHTML += sRow
    }

}

function selectStudent(index)
{
     iSelectedIndex = index
    renderStudents()
}

function showStudentForm()
{
    document.getElementById("studentForm").style.display = "block";
}

function hideStudentForm()
{
    document.getElementById("studentForm").style.display = "none";
}

function clearStudentForm()
{
    document.getElementById("studentForm").reset();
}

function openAddForm()
{
    sformMode = "add";
    iSelectedIndex = -1;
    clearStudentForm()
    renderStudents()
    document.getElementById("formLegend").innerHTML = "Add Student"
    showStudentForm()
    
}

function openEditForm()
{
    if (iSelectedIndex === -1)
    {
        alert("No student is selected! Please select a student.");
    }
    else
    {
        sformMode = "edit";
        let oSelectedStudent = aStudents[iSelectedIndex];
        document.getElementById("firstName").value = oSelectedStudent.firstName;
        document.getElementById("lastName").value = oSelectedStudent.lastName;
        document.getElementById("major").value = oSelectedStudent.major;
        document.getElementById("gpa").value = oSelectedStudent.gpa;
        document.getElementById("year").value = oSelectedStudent.year;
        document.getElementById("birthDate").value = oSelectedStudent.birthDate;
        document.getElementById("password").value = oSelectedStudent.password;
        document.getElementById("comments").value = oSelectedStudent.comments;
        document.getElementById("appointment").value = oSelectedStudent.appointment;
        document.getElementById("fullTime").checked = oSelectedStudent.status === "Full-time";
        document.getElementById("partTime").checked = oSelectedStudent.status === "Part-time";
        document.getElementById("clubProgramming").checked = oSelectedStudent.interests.includes("Programming");
        document.getElementById("clubAnalytics").checked = oSelectedStudent.interests.includes("Analytics");
        document.getElementById("clubBusiness").checked = oSelectedStudent.interests.includes("Business");
        document.getElementById("formLegend").innerHTML = "Edit Student";
        showStudentForm()
    }

    
}

function getFormStudent()
{
let aStudentsInterests = [];
let sFirstName = document.getElementById("firstName").value;
let sLastName = document.getElementById("lastName").value;
let sPassword = document.getElementById("password").value;
let sBirthDate = document.getElementById("birthDate").value;
let sMajor = document.getElementById("major").value;
let sYear = document.getElementById("year").value;
let fGPA = parseFloat(document.getElementById("gpa").value);
let sAppointment = document.getElementById("appointment").value;
let sComments = document.getElementById("comments").value;
let sStatus = "";
if (document.getElementById("fullTime").checked)
{
    sStatus = "Full-time";
}
else
{
    sStatus = "Part-time";
}
if (document.getElementById("clubAnalytics").checked)
{
    aStudentsInterests.push("Analytics");
}
if (document.getElementById("clubProgramming").checked)
{
    aStudentsInterests.push("Programming");
}
if (document.getElementById("clubBusiness").checked)
{
    aStudentsInterests.push("Business");
}

let oStudent = new Student(sFirstName, sLastName, sPassword, sBirthDate, 0,
                            sMajor, sYear, fGPA, sAppointment, sStatus,
                            aStudentsInterests, sComments);
return oStudent;

}

function saveStudent()
{
    let oStudent = getFormStudent()

    if (sformMode === "add")
    {
    oStudent.id = iNextID
    iNextID++
    aStudents.push(oStudent)
    }

    if (sformMode === "edit")
    {
        oStudent.id = aStudents[iSelectedIndex].id;
        aStudents[iSelectedIndex] = oStudent;
    }

    iSelectedIndex = -1
    hideStudentForm()
    renderStudents()
}

function cancelAddEdit()
{
    document.getElementById("studentForm").reset();
    iSelectedIndex = -1;
    hideStudentForm();
    renderStudents();
}

function requestDelete()
{
    if (iSelectedIndex == -1)
    {
        alert("Please select a student to delete!")
    }
    else
    {
        aStudents.splice(iSelectedIndex, 1);
        iSelectedIndex = -1
        hideStudentForm()
        renderStudents()
    }
}





</script>    
</body>
</html>
